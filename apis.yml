aid: virgin-pulse
name: Virgin Pulse
description: >-
  Virgin Pulse is a corporate health and employee wellbeing platform that in
  2024 merged with HealthComp and rebranded as Personify Health, operating
  today at personifyhealth.com. The company delivers a personalized health
  platform that unites wellbeing, healthcare navigation and advocacy, benefits
  administration, third-party administration (TPA), and rewards into a single
  employee experience for enterprises, health plans, and health systems.
  Integration with Personify Health is handled through an authentication-gated
  developer portal (developer.personifyhealth.com) and a partner marketplace
  (marketplace.personifyhealth.com); there is no publicly documented, open API
  specification. This profile was seeded as an Insight Partners portfolio lead
  and enriched from the company's live public surface (llms.txt, status page,
  developer portal, and DNS/TLS probes).
